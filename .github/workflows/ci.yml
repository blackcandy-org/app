name: CI

on: [push, pull_request]

jobs:
  android_lint:
     runs-on: ubuntu-latest
     steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
      - run: |
          curl -sSLO https://github.com/pinterest/ktlint/releases/download/1.8.0/ktlint && chmod a+x ktlint && sudo mv ktlint /usr/local/bin/

      - name: Kotlin lint
        run: ktlint

  ios_lint:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v3
      - run: |
          brew install swiftlint
      - name: Lint
        run: |
          swiftlint

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: gradle

      - name: Run unit tests
        run: ./gradlew :shared:testAndroidHostTest :androidApp:testDebugUnitTest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            shared/build/reports/tests/
            androidApp/build/reports/tests/
